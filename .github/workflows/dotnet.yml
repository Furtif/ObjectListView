name: .NET

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    # ObjectListView targets net481 + WinForms (System.Windows.Forms):
    # it can only build on Windows. Running it on ubuntu/macOS fails,
    # and the old pinned SDK 5.0.202 has no arm64 macOS hostfxr, which
    # causes:
    #   Failed to load libhostfxr.dylib ... (have 'arm64', need 'x86_64')
    name: Build on ${{ matrix.os }} with .NET ${{ matrix.dotnet }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        dotnet: [ '8.0.x' ]
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - name: Install dependencies
        run: dotnet restore
      - name: Build project
        run: dotnet build --no-restore --configuration Release
